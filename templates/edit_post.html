<!DOCTYPE html>
<html>
<head>
  <title>Edit Blog</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h2>Edit Blog</h2>
  <form method="POST">
    <input type="text" name="title" value="{{ post.title }}" required>
    <textarea name="content" required>{{ post.content }}</textarea>
    <button type="submit">Save</button>
  </form>
  <a href="/">Back</a>
</body>
</html>
